<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Театральный Навигатор</title>
  <style>
    :root {
      --bg: #12141c;
      --card-bg: #1c202d;
      --primary: #e5b842;
      --primary-glow: rgba(229, 184, 66, 0.25);
      --text: #f3f4f8;
      --text-muted: #8e92a4;
      --border: #2d3347;
      --item-bg: #242938;
      --active-btn: #e5b842;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    header {
      text-align: center;
      padding: 6px 0;
    }

    h1 {
      font-size: 1.3rem;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .subtitle {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.3);
    }

    .card-title {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 8px;
      display: block;
      font-weight: 600;
    }

    .select-box {
      width: 100%;
      background: var(--item-bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 500;
      outline: none;
    }

    .grid-destinations {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    button.dest-btn {
      background: var(--item-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 8px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }

    button.dest-btn.active {
      background: var(--active-btn);
      color: #0b0c10;
      border-color: var(--active-btn);
      font-weight: 700;
      box-shadow: 0 0 10px var(--primary-glow);
    }

    /* Блок маршрута */
    .route-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .voice-controls {
      display: flex;
      gap: 6px;
    }

    .voice-btn {
      background: #283042;
      border: 1px solid var(--primary);
      color: var(--primary);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .route-steps {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .step-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 0.92rem;
      line-height: 1.45;
      background: var(--item-bg);
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .step-num {
      background: var(--primary);
      color: #0b0c10;
      font-weight: bold;
      min-width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      margin-top: 1px;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Театральный Путеводитель</h1>
    <div class="subtitle">Служебная система ориентирования</div>
  </header>

  <!-- Точка А (Откуда) -->
  <div class="card">
    <span class="card-title">1. Вы находитесь (Точка старта):</span>
    <select id="startSelect" class="select-box" onchange="changeStartPoint(this.value)">
      <option value="entrance">Служебный вход</option>
      <option value="buffet">Буфет</option>
      <option value="main_stage">Основная сцена</option>
      <option value="small_stage">Малая сцена</option>
      <option value="dressing_rooms">Гримёрный блок</option>
      <option value="admin">Администрация</option>
    </select>
  </div>

  <!-- Точка Б (Куда) -->
  <div class="card">
    <span class="card-title">2. Выберите точку назначения:</span>
    <div class="grid-destinations" id="destContainer"></div>
  </div>

  <!-- Результат маршрута -->
  <div class="card" id="routeCard" style="display: none;">
    <div class="route-header">
      <span style="font-size: 0.95rem; color: var(--primary); font-weight: 700;">Пошаговый путь:</span>
      <div class="voice-controls">
        <button class="voice-btn" onclick="playVoice()">
          🔊 Слушать
        </button>
      </div>
    </div>
    <div class="route-steps" id="stepsList"></div>
  </div>
</div>

  let currentStart = 'entrance';
  let currentTarget = null;
  let activeSpeechText = "";

  function init() {
    const urlParams = new URLSearchParams(window.location.search);
    const fromParam = urlParams.get('from');
    if (fromParam && locations.some(l => l.id === fromParam)) {
      currentStart = fromParam;
    }
    document.getElementById('startSelect').value = currentStart;
    renderDestinations();
  }

  function changeStartPoint(newStart) {
    currentStart = newStart;
    currentTarget = null;
    stopVoice();
    document.getElementById('routeCard').style.display = 'none';
    renderDestinations();
  }

  function renderDestinations() {
    const container = document.getElementById('destContainer');
    container.innerHTML = '';

    locations.forEach(loc => {
      if (loc.id !== currentStart) {
        const btn = document.createElement('button');
        btn.className = 'dest-btn';
        btn.innerText = loc.name;
        btn.onclick = () => selectDestination(loc.id, btn);
        container.appendChild(btn);
      }
    });
  }

  function selectDestination(targetId, btnElement) {
    currentTarget = targetId;
    document.querySelectorAll('.dest-btn').forEach(b => b.classList.remove('active'));
    if (btnElement) btnElement.classList.add('active');
    showRoute(currentStart, targetId);
  }

  function showRoute(start, target) {
    const routeCard = document.getElementById('routeCard');
    const stepsList = document.getElementById('stepsList');
    stepsList.innerHTML = '';

    const steps = matrix[start] && matrix[start][target] 
      ? matrix[start][target] 
      : ["Следуйте по указателям коридора."];

    activeSpeechText = steps.join(" ");

    steps.forEach((step, idx) => {
      const row = document.createElement('div');
      row.className = 'step-item';
      row.innerHTML = `<span class="step-num">${idx + 1}</span><span>${step}</span>`;
      stepsList.appendChild(row);
    });

    routeCard.style.display = 'block';
    playVoice();
  }

  /* НАСТРОЕННЫЙ МУЖСКОЙ ГОЛОСОВОЙ ДВИЖОК */
  function playVoice() {
    if (!('speechSynthesis' in window) || !activeSpeechText) return;
    window.speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(activeSpeechText);
    utterance.lang = 'ru-RU';
    utterance.rate = 0.92; // слегка замедленный темп для четкости
    utterance.pitch = 0.8; // пониженный тон (баритон)

    const voices = window.speechSynthesis.getVoices();
    // Приоритет мужских дикторских пакетов
    const maleVoice = voices.find(v => 
      v.lang.startsWith('ru') && 
      (v.name.toLowerCase().includes('male') || 
       v.name.toLowerCase().includes('dmitri') || 
       v.name.toLowerCase().includes('pavel') || 
       v.name.toLowerCase().includes('yuri') ||
       v.name.toLowerCase().includes('alexander') ||
       v.name.toLowerCase().includes('georgy') ||
       v.name.toLowerCase().includes('maxim'))
    ) || voices.find(v => v.lang.startsWith('ru'));

    if (maleVoice) {
      utterance.voice = maleVoice;
    }

    window.speechSynthesis.speak(utterance);
  }

  function stopVoice() {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
    }
  }

  if ('speechSynthesis' in window) {
    window.speechSynthesis.onvoiceschanged = () => {};
  }

  init();
</script>

</html>
