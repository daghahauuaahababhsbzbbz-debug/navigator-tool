<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Театральный Навигатор</title>
  <style>
    :root {
      --bg: #12141c;
      --card-bg: #1c202d;
      --primary: #e5b842;
      --primary-glow: rgba(229, 184, 66, 0.25);
      --text: #f3f4f8;
      --text-muted: #8e92a4;
      --border: #2d3347;
      --item-bg: #242938;
      --active-btn: #e5b842;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    header {
      text-align: center;
      padding: 6px 0;
    }

    h1 {
      font-size: 1.3rem;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .subtitle {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.3);
    }

    .card-title {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 8px;
      display: block;
      font-weight: 600;
    }

    .select-box {
      width: 100%;
      background: var(--item-bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 500;
      outline: none;
    }

    .grid-destinations {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    button.dest-btn {
      background: var(--item-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 8px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }

    button.dest-btn.active {
      background: var(--active-btn);
      color: #0b0c10;
      border-color: var(--active-btn);
      font-weight: 700;
      box-shadow: 0 0 10px var(--primary-glow);
    }

    .route-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .voice-btn {
      background: #283042;
      border: 1px solid var(--primary);
      color: var(--primary);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .voice-btn:active {
      transform: scale(0.96);
    }

    .route-steps {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .step-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 0.92rem;
      line-height: 1.45;
      background: var(--item-bg);
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .step-num {
      background: var(--primary);
      color: #0b0c10;
      font-weight: bold;
      min-width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      margin-top: 1px;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Театральный Путеводитель</h1>
    <div class="subtitle">Служебная система навигации</div>
  </header>

  <div class="card">
    <span class="card-title">1. Вы находитесь (Точка старта):</span>
    <select id="startSelect" class="select-box" onchange="changeStartPoint(this.value)">
      <option value="entrance">1. Служебный вход</option>
      <option value="buffet">2. Буфет</option>
      <option value="main_stage">3. Основная сцена</option>
      <option value="small_stage">4. Малая сцена</option>
      <option value="dressing_rooms">5. Гримёрный блок</option>
      <option value="admin">6. Администрация</option>
    </select>
  </div>

  <div class="card">
    <span class="card-title">2. Выберите точку назначения:</span>
    <div class="grid-destinations" id="destContainer"></div>
  </div>

  <div class="card" id="routeCard" style="display: none;">
    <div class="route-header">
      <span style="font-size: 0.95rem; color: var(--primary); font-weight: 700;">Пошаговый путь:</span>
      <button id="playBtn" class="voice-btn" onclick="toggleAudio()">
        ▶ Слушать аудио
      </button>
    </div>
    <div class="route-steps" id="stepsList"></div>
  </div>
</div>

<script>
  const locations = [
    { id: 'entrance', name: 'Служебный вход' },
    { id: 'buffet', name: 'Буфет' },
    { id: 'main_stage', name: 'Основная сцена' },
    { id: 'small_stage', name: 'Малая сцена' },
    { id: 'dressing_rooms', name: 'Гримёрный блок' },
    { id: 'admin', name: 'Администрация' }
  ];

  const matrix = {
    "entrance": {
      "buffet": "Вперёд, направо, налево и вниз по лестнице, по длинному коридору, 5 ступеней вверх, направо в дверь, справа зал буфета.",
      "main_stage": "Вперёд, направо до указателя «Проход к гримёрным», вверх на 1 этаж, налево на сцену.",
      "small_stage": "Вперёд, направо, налево вниз по лестнице, прямо до конца длинного коридора, направо, вверх на 2 этажа, прямо напротив лестницы малая сцена.",
      "dressing_rooms": "Вперёд, направо до указателя «Проход к гримёрным», вверх на 2 этажа, прямо по коридору перед вами 4 гримерных.",
      "admin": "Вперёд, налево до металлической двери со стеклянным блоком, вверх на 3 этаж."
    },
    "buffet": {
      "entrance": "Налево из двери, 5 ступеней вниз, по длинному коридору, вверх по лестнице, направо к выходу.",
      "main_stage": "Налево из двери, 5 ступеней вниз, по коридору, вверх по лестнице, прямо к указателю «Проход к гримёрным», вверх на 1 этаж, налево на сцену.",
      "small_stage": "Направо из двери, направо по коридору до конца, направо, вверх на 2 этажа.",
      "dressing_rooms": "Налево из двери, 5 ступеней вниз, по коридору, вверх 5 ступеней до указателя «Проход к гримёрным», вверх на 2 этажа, прямо по коридору перед вами 4 гримерных.",
      "admin": "Налево из двери, 5 ступеней вниз, по коридору, вверх 5 ступеней, направо до металлической двери со стеклянным блоком, вверх на 3 этаж."
    },
    "main_stage": {
      "entrance": "Направо в дверь, вниз на 1 этаж, налево по коридору, прямо к выходу.",
      "buffet": "Направо в дверь, вниз на 1 этаж, прямо к лестнице вниз, по длинному коридору, 5 ступеней вверх, направо.",
      "small_stage": "Направо в дверь, вниз на 1 этаж, по лестнице вниз в длинный коридор, до конца, направо, вверх на 2 этажа.",
      "dressing_rooms": "Направо в дверь, вверх на один этаж, прямо по коридору перед вами 4 гримерных.",
      "admin": "Направо в дверь, вверх на два этажа, налево до конца."
    },
    "small_stage": {
      "entrance": "Вниз на 2 этажа, налево в коридор, прямо до конца, вверх по лестнице, направо к выходу.",
      "buffet": "Вниз на 2 этажа, налево в коридор, прямо до двери буфета, налево.",
      "main_stage": "Вниз на 2 этажа, налево в коридор, вверх по лестнице, прямо до указателя «Проход к гримёрным», вверх на 1 этаж, налево на сцену.",
      "dressing_rooms": "Вниз на два этажа, налево по коридору, до указателя «Проход к гримёрным», вверх на два этажа, прямо по коридору перед вами четыре гримерных.",
      "admin": "Вниз на два этажа, налево по коридору, до конца, направо до металлической двери со стеклянным блоком, вверх на третий этаж."
    },
    "dressing_rooms": {
      "entrance": "Вниз на 2 этажа, через металлическую дверь прямо по коридору, направо к выходу.",
      "buffet": "Вниз на 2 этажа, прямо и вниз по лестнице, по длинному коридору, 5 ступеней вверх, направо в дверь, справа зал буфета.",
      "main_stage": "Вниз на один этаж, налево на сцену.",
      "small_stage": "Вниз на 2 этажа, через дверь в холл, направо, вниз по лестнице, по коридору до конца, направо, вверх на 2 этажа.",
      "admin": "По лестничной клетке подняться на 1 этаж выше (на 3 этаж)."
    },
    "admin": {
      "entrance": "Вниз на 3 этажа, через металлическую дверь со стеклом направо по коридору, направо к выходу.",
      "buffet": "Вниз на 3 этажа, через дверь направо, прямо по коридору, налево вниз по лестнице, по длинному коридору, 5 ступеней вверх, направо.",
      "main_stage": "Вниз на 3 этажа, через дверь в холл, направо до указателя, вверх на 1 этаж, налево на сцену.",
      "small_stage": "Вниз на 3 этажа, через дверь по коридору, налево, вниз по лестнице, по коридору до конца, направо, вверх на 2 этажа.",
      "dressing_rooms": "Через третий этаж пройти мимо кабинетов до лестничной клетки, спуститься на один этаж."
    }
  };

  let currentStart = 'entrance';
  let currentTarget = null;
  let currentAudio = null;

  function init() {
    const urlParams = new URLSearchParams(window.location.search);
    const fromParam = urlParams.get('from');
    if (fromParam && locations.some(l => l.id === fromParam)) {
      currentStart = fromParam;
    }
    document.getElementById('startSelect').value = currentStart;
    renderDestinations();
  }

  function changeStartPoint(newStart) {
    currentStart = newStart;
    currentTarget = null;
    stopAudio();
    document.getElementById('routeCard').style.display = 'none';
    renderDestinations();
  }

  function renderDestinations() {
    const container = document.getElementById('destContainer');
    container.innerHTML = '';

    locations.forEach(loc => {
      if (loc.id !== currentStart) {
        const btn = document.createElement('button');
        btn.className = 'dest-btn';
        btn.innerText = loc.name;
        btn.onclick = () => selectDestination(loc.id, btn);
        container.appendChild(btn);
      }
    });
  }

  function selectDestination(targetId, btnElement) {
    currentTarget = targetId;
    document.querySelectorAll('.dest-btn').forEach(b => b.classList.remove('active'));
    if (btnElement) btnElement.classList.add('active');
    showRoute(currentStart, targetId);
  }

  function showRoute(start, target) {
    const routeCard = document.getElementById('routeCard');
    const stepsList = document.getElementById('stepsList');
    stepsList.innerHTML = '';

    const rawRoute = matrix[start] && matrix[start][target] 
      ? matrix[start][target] 
      : "Следуйте по указателям коридора.";

    const steps = rawRoute.split(/,\s+|\.\s+/).filter(s => s.trim().length > 0);

    steps.forEach((step, idx) => {
      const formattedStep = step.trim().replace(/^./, str => str.toUpperCase());
      const row = document.createElement('div');
      row.className = 'step-item';
      row.innerHTML = `<span class="step-num">${idx + 1}</span><span>${formattedStep}.</span>`;
      stepsList.appendChild(row);
    });

    routeCard.style.display = 'block';
    setupAudio(start, target);
  }

  function setupAudio(start, target) {
    stopAudio();

    const base = `${start}_${target}`;
    // Проверяем как имя с двойным .mp3.mp3, так и стандартное
    const candidates = [
      `audio/${base}.mp3.mp3`,
      `audio/${base}.mp3`,
      `${base}.mp3.mp3`,
      `${base}.mp3`
    ];

    tryLoadAudio(candidates, 0);
  }

  function tryLoadAudio(candidates, index) {
    if (index >= candidates.length) {
      const btn = document.getElementById('playBtn');
      btn.innerHTML = '⚠️ Файл не найден';
      return;
    }

    const audio = new Audio(candidates[index]);
    currentAudio = audio;
    bindAudioEvents(audio);

    audio.oncanplay = () => {
      audio.play().catch(() => {
        resetPlayBtn();
      });
    };

    audio.onerror = () => {
      tryLoadAudio(candidates, index + 1);
    };
  }

  function bindAudioEvents(audio) {
    const btn = document.getElementById('playBtn');
    audio.onplay = () => { btn.innerHTML = '⏸ Пауза'; };
    audio.onpause = () => { btn.innerHTML = '▶ Слушать аудио'; };
    audio.onended = () => { btn.innerHTML = '▶ Слушать аудио'; };
  }

  function toggleAudio() {
    if (!currentAudio) {
      if (currentStart && currentTarget) {
        setupAudio(currentStart, currentTarget);
      }
      return;
    }

    if (currentAudio.paused) {
      currentAudio.play();
    } else {
      currentAudio.pause();
    }
  }

  function stopAudio() {
    if (currentAudio) {
      currentAudio.pause();
      currentAudio.currentTime = 0;
      currentAudio = null;
    }
    resetPlayBtn();
  }

  function resetPlayBtn() {
    const btn = document.getElementById('playBtn');
    if (btn) btn.innerHTML = '▶ Слушать аудио';
  }

  init();
</script>
</body>
</html>
