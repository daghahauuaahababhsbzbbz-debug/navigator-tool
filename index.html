<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Театральный Навигатор</title>
  <style>
    :root {
      --bg: #12141c;
      --card-bg: #1c202d;
      --primary: #e5b842;
      --primary-glow: rgba(229, 184, 66, 0.4);
      --text: #f3f4f8;
      --text-muted: #9aa0b4;
      --border: #2d3347;
      --corridor: #262b3d;
      --wall: #3e465e;
      --target-node: #ff4757;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 14px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    header {
      text-align: center;
      padding: 4px 0;
    }

    h1 {
      font-size: 1.35rem;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .subtitle {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.35);
    }

    .status-badge {
      display: inline-block;
      background: rgba(229, 184, 66, 0.15);
      color: var(--primary);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .change-start-select {
      width: 100%;
      background: #252b3d;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
    }

    .grid-destinations {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }

    button.dest-btn {
      background: #252b3d;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 8px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    button.dest-btn:active, button.dest-btn.active {
      background: var(--primary);
      color: #0b0c10;
      border-color: var(--primary);
      font-weight: 700;
      box-shadow: 0 0 10px var(--primary-glow);
    }

    /* Карта */
    .map-box {
      width: 100%;
      background: #141722;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
      position: relative;
    }

    svg {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Анимация линии маршрута */
    @keyframes dash {
      to {
        stroke-dashoffset: -40;
      }
    }

    .active-route-path {
      stroke: var(--primary);
      stroke-width: 4;
      stroke-dasharray: 6 4;
      stroke-linecap: round;
      fill: none;
      animation: dash 1.2s linear infinite;
    }

    /* Блок маршрута */
    .route-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .voice-btn {
      background: #2e354b;
      border: 1px solid var(--primary);
      color: var(--primary);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .route-steps {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .step-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 0.9rem;
      line-height: 1.4;
    }

    .step-num {
      background: var(--primary);
      color: #0b0c10;
      font-weight: bold;
      min-width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      margin-top: 2px;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Театральный Навигатор</h1>
    <div class="subtitle">Служебный гид с голосовым сопровождением</div>
  </header>

  <!-- Точка старта -->
  <div class="card">
    <div class="status-badge">Вы находитесь:</div>
    <select id="startSelect" class="change-start-select" onchange="changeStartPoint(this.value)">
      <option value="entrance">Служебный вход (Точка А)</option>
      <option value="buffet">Буфет (Точка B)</option>
      <option value="main_stage">Основная сцена (Точка C)</option>
      <option value="small_stage">Малая сцена (Точка D)</option>
      <option value="dressing_rooms">Гримёрный блок (Точка E)</option>
      <option value="admin">Администрация (Точка F)</option>
    </select>
  </div>

  <!-- Выбор цели -->
  <div class="card">
    <span style="font-size: 0.85rem; color: var(--text-muted);">Куда вам нужно попасть?</span>
    <div class="grid-destinations" id="destContainer"></div>
  </div>

  <!-- Архитектурно-коридорная схема -->
  <div class="card map-box">
    <svg viewBox="0 0 360 300" id="theaterMap">
      <!-- Стены и фоновые блоки здания -->
      <rect x="20" y="20" width="320" height="260" rx="6" fill="#181c28" stroke="#2c3349" stroke-width="2" />
      
      <!-- Коридорная сетка -->
      <path d="M 180,260 L 180,170 L 60,170 L 60,40" fill="none" stroke="#262d42" stroke-width="22" stroke-linejoin="round" />
      <path d="M 180,170 L 300,170 L 300,40" fill="none" stroke="#262d42" stroke-width="22" stroke-linejoin="round" />
      <path d="M 300,170 L 300,240" fill="none" stroke="#262d42" stroke-width="22" stroke-linejoin="round" />

      <!-- Лестничные марши (схематично) -->
      <rect x="52" y="100" width="16" height="25" fill="#323a54" rx="2"/>
      <line x1="52" y1="108" x2="68" y2="108" stroke="#485375" stroke-width="1.5"/>
      <line x1="52" y1="116" x2="68" y2="116" stroke="#485375" stroke-width="1.5"/>
      <line x1="52" y1="124" x2="68" y2="124" stroke="#485375" stroke-width="1.5"/>

      <rect x="292" y="125" width="16" height="25" fill="#323a54" rx="2"/>
      <line x1="292" y1="133" x2="308" y2="133" stroke="#485375" stroke-width="1.5"/>
      <line x1="292" y1="141" x2="308" y2="141" stroke="#485375" stroke-width="1.5"/>

      <!-- Слой активного маршрута -->
      <g id="routeLayer"></g>

      <!-- Узлы локаций -->
      <!-- Вход (А) -->
      <circle cx="180" cy="260" r="10" fill="#e5b842" id="node-entrance" />
      <text x="180" y="280" fill="#fff" font-size="10" font-weight="bold" text-anchor="middle">Вход (A)</text>

      <!-- Буфет (B) -->
      <circle cx="300" cy="240" r="8" fill="#757d99" id="node-buffet" />
      <text x="300" y="258" fill="#9aa0b4" font-size="9" text-anchor="middle">Буфет (B)</text>

      <!-- Основная сцена (C) -->
      <circle cx="300" cy="110" r="8" fill="#757d99" id="node-main_stage" />
      <text x="300" y="98" fill="#9aa0b4" font-size="9" text-anchor="middle">Осн. сцена (C)</text>

      <!-- Малая сцена (D) -->
      <circle cx="300" cy="40" r="8" fill="#757d99" id="node-small_stage" />
      <text x="300" y="28" fill="#9aa0b4" font-size="9" text-anchor="middle">Мал. сцена (D)</text>

      <!-- Гримёрный блок (E) -->
      <circle cx="60" cy="100" r="8" fill="#757d99" id="node-dressing_rooms" />
      <text x="60" y="90" fill="#9aa0b4" font-size="9" text-anchor="middle">Гримёрки (E)</text>

      <!-- Администрация (F) -->
      <circle cx="60" cy="40" r="8" fill="#757d99" id="node-admin" />
      <text x="60" y="28" fill="#9aa0b4" font-size="9" text-anchor="middle">Админ. (F)</text>
    </svg>
  </div>

  <!-- Блок пошаговой инструкции -->
  <div class="card" id="routeCard" style="display: none;">
    <div class="route-header">
      <span style="font-size: 0.9rem; color: var(--primary); font-weight: 700;">Маршрут:</span>
      <button class="voice-btn" onclick="replayVoice()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
        Озвучить снова
      </button>
    </div>
    <div class="route-steps" id="stepsList"></div>
  </div>
</div>

<script>
  const locations = [
    { id: 'entrance', name: 'Служебный вход' },
    { id: 'buffet', name: 'Буфет' },
    { id: 'main_stage', name: 'Основная сцена' },
    { id: 'small_stage', name: 'Малая сцена' },
    { id: 'dressing_rooms', name: 'Гримёрный блок' },
    { id: 'admin', name: 'Администрация' }
  ];

  // Траектории для отрисовки карты (SVG path)
  const mapPaths = {
    "entrance-buffet": "M 180,260 L 180,170 L 300,170 L 300,240",
    "entrance-main_stage": "M 180,260 L 180,170 L 300,170 L 300,110",
    "entrance-small_stage": "M 180,260 L 180,170 L 300,170 L 300,40",
    "entrance-dressing_rooms": "M 180,260 L 180,170 L 60,170 L 60,100",
    "entrance-admin": "M 180,260 L 180,170 L 60,170 L 60,40"
  };

  const routes = {
    "entrance": {
      "buffet": [
        "Пройдите вперёд от входа и поверните направо.",
        "Идите по коридору до лестницы с левой стороны.",
        "Спуститесь по лестнице вниз и следуйте по длинному коридору вперёд.",
        "Подойдите к небольшой лестнице из пяти ступеней с открытой дверью.",
        "Пройдите в дверь и поверните направо — вы в буфете."
      ],
      "main_stage": [
        "Пройдите прямо до коридора и поверните направо.",
        "Дойдите до двери с указателем «Проход к гримёрным комнатам».",
        "Поднимитесь по лестнице на один этаж вверх.",
        "Сразу за дверью поверните налево — дверь на Основную сцену."
      ],
      "small_stage": [
        "Пройдите прямо, поверните направо и спуститесь по лестнице слева вниз.",
        "Идите по длинному коридору прямо до конца, не заходя в буфет.",
        "Поверните направо и поднимитесь по лестнице на два этажа вверх — перед вами Малый зал."
      ],
      "dressing_rooms": [
        "Пройдите от входа прямо и поверните налево.",
        "Дойдите до металлической двери со стеклянным блоком.",
        "Поднимитесь по лестнице на два этажа вверх в гримёрный блок."
      ],
      "admin": [
        "Пройдите прямо и поверните налево.",
        "Дойдите до металлической двери со стеклянной вставкой.",
        "Поднимитесь по лестнице на третий этаж в Администрацию."
      ]
    }
  };

  let currentStart = 'entrance';
  let currentTarget = null;
  let currentSpeechText = "";

  function init() {
    const urlParams = new URLSearchParams(window.location.search);
    const fromParam = urlParams.get('from');
    if (fromParam && locations.some(l => l.id === fromParam)) {
      currentStart = fromParam;
    }
    document.getElementById('startSelect').value = currentStart;
    renderDestinations();
  }

  function changeStartPoint(newStart) {
    currentStart = newStart;
    currentTarget = null;
    stopVoice();
    document.getElementById('routeCard').style.display = 'none';
    resetMapHighlight();
    renderDestinations();
  }

  function renderDestinations() {
    const container = document.getElementById('destContainer');
    container.innerHTML = '';

    locations.forEach(loc => {
      if (loc.id !== currentStart) {
        const btn = document.createElement('button');
        btn.className = 'dest-btn';
        btn.innerText = loc.name;
        btn.onclick = () => selectDestination(loc.id, btn);
        container.appendChild(btn);
      }
    });
  }

  function selectDestination(targetId, btnElement) {
    currentTarget = targetId;
    document.querySelectorAll('.dest-btn').forEach(b => b.classList.remove('active'));
    if (btnElement) btnElement.classList.add('active');

    drawRouteOnMap(currentStart, targetId);
    showRouteTextAndSpeak(currentStart, targetId);
  }

  function showRouteTextAndSpeak(start, target) {
    const routeCard = document.getElementById('routeCard');
    const stepsList = document.getElementById('stepsList');
    stepsList.innerHTML = '';

    const steps = routes[start] && routes[start][target] 
      ? routes[start][target] 
      : ["Пройдите в обратном порядке ориентиров до нужного блока."];

    currentSpeechText = steps.join(" ");

    steps.forEach((step, idx) => {
      const row = document.createElement('div');
      row.className = 'step-item';
      row.innerHTML = `<span class="step-num">${idx + 1}</span><span>${step}</span>`;
      stepsList.appendChild(row);
    });

    routeCard.style.display = 'block';
    speak(currentSpeechText);
  }

  function resetMapHighlight() {
    document.getElementById('routeLayer').innerHTML = '';
    document.querySelectorAll('#theaterMap circle').forEach(c => c.setAttribute('fill', '#757d99'));
    const startNode = document.getElementById(`node-${currentStart}`);
    if (startNode) startNode.setAttribute('fill', '#e5b842');
  }

  function drawRouteOnMap(start, target) {
    resetMapHighlight();
    const targetNode = document.getElementById(`node-${target}`);
    if (targetNode) targetNode.setAttribute('fill', '#ff4757');

    const pathKey = `${start}-${target}`;
    const d = mapPaths[pathKey];
    if (d) {
      const routeLayer = document.getElementById('routeLayer');
      const pathEl = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      pathEl.setAttribute('d', d);
      pathEl.setAttribute('class', 'active-route-path');
      routeLayer.appendChild(pathEl);
    }
  }

  /* ГОЛОСОВОЙ ДВИЖОК (МУЖСКОЙ ГОЛОС) */
  function speak(text) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'ru-RU';
    utterance.rate = 0.95; // комфортный темп
    utterance.pitch = 0.85; // более глубокий/мужской тембр

    const voices = window.speechSynthesis.getVoices();
    // Ищем русский мужской голос
    const maleVoice = voices.find(v => 
      v.lang.includes('ru') && 
      (v.name.toLowerCase().includes('male') || 
       v.name.toLowerCase().includes('dmitri') || 
       v.name.toLowerCase().includes('pavel') || 
       v.name.toLowerCase().includes('yuri') ||
       v.name.toLowerCase().includes('alexander'))
    ) || voices.find(v => v.lang.includes('ru'));

    if (maleVoice) utterance.voice = maleVoice;

    window.speechSynthesis.speak(utterance);
  }

  function replayVoice() {
    if (currentSpeechText) speak(currentSpeechText);
  }

  function stopVoice() {
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  }

  // Подгрузка списка голосов при старте
  if ('speechSynthesis' in window) {
    window.speechSynthesis.onvoiceschanged = () => {};
  }

  init();
</script>
</body>
</html>
